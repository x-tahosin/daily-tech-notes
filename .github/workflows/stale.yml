name: Close stale issues

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "This issue has been inactive for 60 days. It will close in 14 days if no further activity occurs."
          stale-pr-message: "This PR has been inactive for 60 days. It will close in 14 days if no further activity occurs."
